<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DataMarket replaces $500K–$1M proprietary data portals with a self-service marketplace on Databricks">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a2338" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2338" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#003865"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.055"/>

  <!-- Wordmark -->
  <g transform="translate(48, 40)">
    <g fill="#FF3621">
      <rect x="0" y="2" width="11" height="11" rx="2"/>
      <rect x="15" y="2" width="11" height="11" rx="2"/>
      <rect x="0" y="17" width="11" height="11" rx="2"/>
      <rect x="15" y="17" width="11" height="11" rx="2"/>
    </g>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#ffffff">DataMarket</text>
    <text x="36" y="48" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Self-service data product marketplace · Built on Databricks</text>
  </g>

  <!-- Headline -->
  <text x="48" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#ffffff">Stop buying a portal. Ship one on the lakehouse.</text>
  <text x="48" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#cbd5e1">Replace proprietary data catalogs costing $500K–$1M+ with governed discovery, access, and AI — natively on Databricks.</text>

  <!-- LEFT: Problem panel -->
  <g transform="translate(48, 210)">
    <rect width="480" height="280" rx="16" fill="url(#panel)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="28" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f87171">THE PROBLEM</text>
    <text x="28" y="78" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Proprietary data portals</text>

    <!-- Cost callout -->
    <rect x="28" y="100" width="200" height="52" rx="10" fill="#7f1d1d" opacity="0.45"/>
    <text x="48" y="132" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fecaca">$500K – $1M+</text>

    <!-- Pain bullets -->
    <g font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      <circle cx="36" cy="188" r="4" fill="#f87171"/>
      <text x="52" y="193">Vendor lock-in &amp; long implementations</text>
      <circle cx="36" cy="222" r="4" fill="#f87171"/>
      <text x="52" y="227">Shadow IT copies of “the real catalog”</text>
      <circle cx="36" cy="256" r="4" fill="#f87171"/>
      <text x="52" y="261">Governance bolted on after the fact</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(560, 330)">
    <circle cx="40" cy="40" r="36" fill="#FF3621"/>
    <path d="M24 40 H48 M42 28 L56 40 L42 52" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: Solution panel -->
  <g transform="translate(672, 210)">
    <rect width="480" height="280" rx="16" fill="#ffffff" opacity="0.97"/>
    <text x="28" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FF3621">THE SHIFT</text>
    <text x="28" y="78" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">DataMarket on Databricks</text>

    <!-- Outcome rows -->
    <g font-family="system-ui, sans-serif">
      <rect x="28" y="100" width="424" height="44" rx="10" fill="#f1f5f9"/>
      <text x="48" y="128" font-size="15" font-weight="600" fill="#0f172a">Discover products with Ask AI</text>

      <rect x="28" y="154" width="424" height="44" rx="10" fill="#f1f5f9"/>
      <text x="48" y="182" font-size="15" font-weight="600" fill="#0f172a">Request → approve → real UC GRANT</text>

      <rect x="28" y="208" width="424" height="44" rx="10" fill="#f1f5f9"/>
      <text x="48" y="236" font-size="15" font-weight="600" fill="#0f172a">RBAC / ABAC enforced in Unity Catalog</text>
    </g>
  </g>

  <!-- Bottom chips -->
  <g transform="translate(48, 520)" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">
    <rect x="0" y="0" width="168" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="84" y="23" text-anchor="middle">Replace $1M portals</text>

    <rect x="184" y="0" width="130" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="249" y="23" text-anchor="middle">Native RBAC</text>

    <rect x="330" y="0" width="160" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="410" y="23" text-anchor="middle">Access workflows</text>

    <rect x="506" y="0" width="132" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="572" y="23" text-anchor="middle">AI discovery</text>
  </g>

  <!-- Built on Databricks badge -->
  <g transform="translate(980, 528)">
    <rect width="172" height="36" rx="8" fill="#ffffff" opacity="0.1"/>
    <polygon points="18,10 28,28 8,28" fill="#FF3621"/>
    <text x="40" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Built on Databricks</text>
  </g>
</svg>
